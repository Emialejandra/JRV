<ion-header>
  <ion-toolbar>
    <ion-title>Cambiar contraseña</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  <div class="form-container">

    <h1>Cambiar contraseña</h1>

    <p>
      Por seguridad, debes establecer una nueva contraseña.
    </p>

    <form
      [formGroup]="formulario"
      (ngSubmit)="cambiarPassword()">

      <ion-item>
        <ion-input
          label="Nueva contraseña"
          labelPlacement="stacked"
          type="password"
          formControlName="password">
        </ion-input>
      </ion-item>

      <ion-text color="medium">
        <p class="ayuda">
          La contraseña debe tener al menos 8 caracteres.
        </p>
      </ion-text>

      <ion-item>
        <ion-input
          label="Confirmar contraseña"
          labelPlacement="stacked"
          type="password"
          formControlName="confirmarPassword">
        </ion-input>
      </ion-item>

      <ion-button
        expand="block"
        type="submit"
        [disabled]="cargando">

        <ion-spinner
          *ngIf="cargando"
          name="crescent">
        </ion-spinner>

        <span *ngIf="!cargando">
          Cambiar contraseña
        </span>

      </ion-button>

    </form>

    <ion-text color="danger" *ngIf="mensajeError">
      <p class="mensaje-error">
        {{ mensajeError }}
      </p>
    </ion-text>

    <ion-text color="success" *ngIf="mensajeExito">
      <p class="mensaje-exito">
        {{ mensajeExito }}
      </p>
    </ion-text>

  </div>

</ion-content>
