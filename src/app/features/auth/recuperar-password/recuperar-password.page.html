<ion-header>
  <ion-toolbar>
    <ion-title>Recuperar contraseña</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  <div class="form-container">

    <h1>Recuperar contraseña</h1>

    <p>
      Ingresa tu correo electrónico para recibir
      un enlace de recuperación.
    </p>

    <form
      [formGroup]="formulario"
      (ngSubmit)="recuperarPassword()">

      <ion-item>
        <ion-input
          label="Correo electrónico"
          labelPlacement="stacked"
          type="email"
          formControlName="email">
        </ion-input>
      </ion-item>

      <ion-text color="danger"
        *ngIf="
          formulario.get('email')?.touched &&
          formulario.get('email')?.invalid
        ">
        <p class="mensaje-validacion">
          Ingresa un correo electrónico válido.
        </p>
      </ion-text>

      <ion-button
        expand="block"
        type="submit"
        [disabled]="cargando">

        <ion-spinner
          *ngIf="cargando"
          name="crescent">
        </ion-spinner>

        <span *ngIf="!cargando">
          Enviar enlace
        </span>

      </ion-button>

    </form>

    <ion-text color="danger" *ngIf="mensajeError">
      <p class="mensaje-error">
        {{ mensajeError }}
      </p>
    </ion-text>

    <ion-text color="success" *ngIf="mensajeExito">
      <p class="mensaje-exito">
        {{ mensajeExito }}
      </p>
    </ion-text>

    <ion-button
      fill="clear"
      expand="block"
      (click)="volverLogin()">
      Volver al inicio de sesión
    </ion-button>

  </div>

</ion-content>
